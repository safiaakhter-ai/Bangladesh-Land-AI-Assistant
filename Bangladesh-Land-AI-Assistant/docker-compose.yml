services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      LAND_DATA_DIR: /app/data
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ENABLE_SCRAPER: "false"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - local
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - local
networks:
  local:
    driver: bridge
